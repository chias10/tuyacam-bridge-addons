name: "Tuya + Meari Cam Bridge RTSP"
version: "3.3.1"
slug: "tuyacam_bridge"
description: >-
  Eliminates redundant Tuya cloud sessions by maintaining a single
  authenticated connection and re-broadcasting your camera's native
  RTSP feed to a stable local endpoint. Now also bridges Meari /
  CloudEdge cameras (ZUMIMALL, Arenti, etc.) over P2P (PPCS/Kalay).
  Built for multi-consumer setups — Home Assistant, Frigate, VLC, and
  Alexa can all watch simultaneously.
url: "https://github.com/chias10/tuyacam-bridge-addons/tree/main/tuyacam_bridge"
image: "ghcr.io/chias10/{arch}-addon-tuyacam-bridge"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
hassio_api: false
homeassistant_api: false
ports:
  8554/tcp: 8554
  8889/tcp: 8889
  9101/tcp: 9101
ports_description:
  8554/tcp: "Local RTSP (camera stream)"
  8889/tcp: "Local WebRTC (optional)"
  9101/tcp: "Prometheus metrics (/metrics)"
options:
  tuya_base_url: "https://openapi.tuyaus.com"
  tuya_client_id: ""
  tuya_client_secret: ""
  cameras:
    - name: "tuya_cam"
      device_id: ""
      stream_type: 0
  meari_cameras: []
schema:
  tuya_base_url: "url"
  tuya_client_id: "str?"
  tuya_client_secret: "password?"
  cameras:
    - name: "str"
      device_id: "str"
      stream_type: "int(0,1)"
  meari_cameras:
    - name: "str"
      did: "str"
      suffix: "str"
      hostkey: "password"
      initstring: "password"
      licenceid: "str"
      stream: "int(0,1)?"
