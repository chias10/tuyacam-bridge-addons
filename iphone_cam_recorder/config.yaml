name: "iPhone Cam Auto Recorder"
version: "1.1.0"
slug: "iphone_cam_recorder"
description: >-
  Escucha el sensor de Home Assistant que publica la URL de la cámara del
  iPhone (la IP cambia), y en cuanto la URL emite video lo graba, en LAN
  o fuera de ella (vía VPN/Tailscale con fallback_host).
url: "https://github.com/chias10/tuyacam-bridge-addons/tree/main/iphone_cam_recorder"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: true
homeassistant_api: true
map:
  - media:rw
options:
  scan_interval: 15
  segment_minutes: 10
  retention_days: 14
  recordings_dir: "/media/iphone_recordings"
  notify_service: ""
  devices:
    - name: "iphone_aziel"
      entity: "sensor.anna_camera_stream"
      fallback_host: ""
schema:
  scan_interval: "int(5,600)"
  segment_minutes: "int(1,120)"
  retention_days: "int(0,3650)"
  recordings_dir: "str"
  notify_service: "str?"
  devices:
    - name: "match(^[A-Za-z0-9_-]+$)"
      entity: "str"
      fallback_host: "str?"
