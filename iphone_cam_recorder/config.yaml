name: "iPhone Cam Auto Recorder"
version: "1.5.0"
slug: "iphone_cam_recorder"
description: >-
  Escucha el sensor de Home Assistant que publica la URL de la cámara del
  iPhone (la IP cambia). Cada vez que la app se abre (trigger "launch")
  intenta grabar durante unos segundos; si no hay video, espera al
  siguiente launch. Solo funciona con el iPhone en la misma LAN.
url: "https://github.com/chias10/tuyacam-bridge-addons/tree/main/iphone_cam_recorder"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: true
homeassistant_api: true
map:
  - media:rw
options:
  attempt_seconds: 15
  segment_minutes: 10
  retention_days: 14
  transcode_h264: false
  recordings_dir: "/media/iphone_recordings"
  notify_service: ""
  devices:
    - name: "iphone_aziel"
      entity: "sensor.anna_camera_stream"
      trigger_entity: "sensor.anna_last_update_trigger"
      trigger_state: "launch"
schema:
  attempt_seconds: "int(5,120)"
  segment_minutes: "int(1,120)"
  retention_days: "int(0,3650)"
  transcode_h264: "bool"
  recordings_dir: "str"
  notify_service: "str?"
  devices:
    - name: "str"
      entity: "str"
      trigger_entity: "str"
      trigger_state: "str?"
